name: Publish to npm

# 打 v* tag 时自动构建、测试并发布到 npm registry。
# 发布走 trusted publishing (OIDC)：npmjs.com 包设置里已授权本仓库 workflow，无需 token。
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 用于 npm publish --provenance 的 OIDC 签名
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # 项目 .npmrc 已用 omit[]= 覆盖 npm 11 的默认 omit=dev，CI 会安装 dev 依赖
      - run: npm ci

      # 发布前完整验证
      - run: npm test

      - run: npm publish --provenance --access public

      # 发布后主动触发 npmmirror 同步，缩短国内镜像拉取新版本的时间窗口。
      # 镜像同步是异步任务，失败也不影响 npm 发布本身，故不阻塞 job。
      - name: Sync npmmirror mirror
        continue-on-error: true
        run: |
          curl -fsS -X PUT "https://registry.npmmirror.com/-/package/pi-tsgw/syncs" \
            -o /dev/null -w "npmmirror sync: HTTP %{http_code}\n"
